name: CI - Build and Push to Scaleway

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Scaleway CLI
        run: curl -s https://raw.githubusercontent.com/scaleway/scaleway-cli/master/scripts/get.sh | sh

      - name: Ensure Registry Namespace Exists
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCALEWAY_ACCESS }}
          SCW_SECRET_KEY: ${{ secrets.SCALEWAY_SECRET }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCALEWAY_PROJECT_ID }}
          SCW_DEFAULT_REGION: fr-par
          SCW_DEFAULT_ZONE: fr-par-1
        run: |
          if ! scw registry namespace get name=scorimundi > /dev/null 2>&1; then
            scw registry namespace create name=scorimundi description="Scorimundi Monorepo Registry"
          fi

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCALEWAY_SECRET }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: rg.fr-par.scw.cloud/scorimundi/scorimundi-mono:latest
          cache-from: type=gha
          cache-to: type=inline
